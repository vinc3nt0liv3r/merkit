name: ui-screenshots

# Builds a special copy of the app that renders its own windows to PNG files, so the interface can be reviewed.
# The shipped application is built without this code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/Merkit.App/**'
      - '.github/workflows/ui-screenshots.yml'

permissions:
  contents: write   # only used to refresh the "ui-screenshots" preview branch below

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build screenshot edition
        run: dotnet build src/Merkit.App/Merkit.App.csproj -c Release -p:MerkitScreenshots=true -o out

      - name: Render windows
        shell: pwsh
        run: |
          $process = Start-Process -FilePath out\Merkit.exe -ArgumentList '--screenshots', 'shots' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Merkit did not finish in time.' }
          Get-ChildItem shots | Format-Table Name, Length
          if (Test-Path shots\error.txt) { Get-Content shots\error.txt; throw 'Screenshot run failed.' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots

      # Publish the pictures on a branch of their own so they can be looked at without downloading an artifact.
      # They show the built-in sample domain only. The branch is rewritten on every run.
      - name: Publish preview branch
        if: github.event_name != 'pull_request' && always() && hashFiles('shots/*.png') != ''
        shell: pwsh
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout --orphan ui-screenshots
          git rm -rf --quiet . 2>$null
          Copy-Item shots\* . -Include *.png
          git add *.png
          git commit -m "UI screenshots for ${env:GITHUB_SHA}"
          git push --force origin ui-screenshots
